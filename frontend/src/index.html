<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kora · Tu comunidad habla. Kora publica.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kora — Tu comunidad habla. Kora publica. Motor de IA que convierte las conversaciones de tu comunidad en contenido listo para publicar.">
  <link rel="icon" type="image/png" href="image/logo/KoraLogo.png">
  <link rel="apple-touch-icon" href="image/logo/KoraLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script>
    // Apply saved theme before Angular boots to avoid a light flash
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
