name: sync backend to main

on:
  push:
    branches: [backend]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sincronizar backend y gestionar PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B sync/backend main
          git fetch origin

          # Verificar existencia de la rama remota
          if git ls-remote --exit-code --heads origin backend; then
            echo "La rama origin/backend existe. Ejecutando subtree..."

            if [ -d "backend" ]; then
              git subtree pull --prefix=backend origin backend -m "sync: Update backend from branch backend"
            else
              git subtree add --prefix=backend origin backend -m "sync: Add backend subtree from branch backend"
            fi

            # Subir la rama puente al remoto
            git push origin sync/backend --force

            # Crea o reutiliza el PR únicamente si el push fue exitoso
            gh pr create \
              --base main \
              --head sync/backend \
              --title "Sync: update backend" \
              --body "Automatic update of the content \`backend/\` in \`main\`, generated from branch \`backend\`." \
            || echo "Already exists PR for sync/backend -> main; branch updated."

          else
            echo "La rama origin/backend aún no existe en el remoto. Omitiendo sincronización."
          fi
