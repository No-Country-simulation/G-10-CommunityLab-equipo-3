name: sync backend to main

on:
  push:
    branches: [backend]

concurrency:
  group: sync-backend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar identidad del Desarrollador
        # Los valores se pasan por env (no interpolados en el script)
        # para evitar inyección de comandos vía nombre/email del autor.
        env:
          COMMIT_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          DEV_NAME="$COMMIT_NAME"
          DEV_EMAIL="$COMMIT_EMAIL"

          # Respaldo si el evento no trae metadatos directos del commit
          if [ -z "$DEV_EMAIL" ] || [ "$DEV_EMAIL" == "null" ]; then
            DEV_NAME="$ACTOR"
            DEV_EMAIL="${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          fi

          echo "Asignando commits a: $DEV_NAME <$DEV_EMAIL>"

          # Configuración estándar de Git
          git config user.name "$DEV_NAME"
          git config user.email "$DEV_EMAIL"

          # Forzar que el commit de merge del subtree use la identidad
          # del dev y NO la del bot
          {
            echo "GIT_AUTHOR_NAME=$DEV_NAME"
            echo "GIT_AUTHOR_EMAIL=$DEV_EMAIL"
            echo "GIT_COMMITTER_NAME=$DEV_NAME"
            echo "GIT_COMMITTER_EMAIL=$DEV_EMAIL"
          } >> "$GITHUB_ENV"

      - name: Sincronizar backend y gestionar PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin

          # Verificar existencia de la rama remota
          if ! git ls-remote --exit-code --heads origin backend > /dev/null; then
            echo "La rama origin/backend aún no existe en el remoto. Omitiendo sincronización."
            exit 0
          fi

          # Rama puente siempre parte del estado actual de main
          git checkout -B sync/backend main

          # NOTA: NO usar --squash. Así se conservan intactos todos los
          # commits individuales (autoría, fechas y líneas) de cada dev.
          if [ -d "backend" ]; then
            git subtree pull --prefix=backend origin backend \
              -m "sync: Update backend from branch backend"
          else
            git subtree add --prefix=backend origin backend \
              -m "sync: Add backend subtree from branch backend"
          fi

          # Si no hay diferencias respecto a main, no hay nada que sincronizar
          if [ -z "$(git rev-list main..sync/backend)" ]; then
            echo "sync/backend no tiene cambios respecto a main. Nada que hacer."
            exit 0
          fi

          # Subir la rama puente (force: es una rama auxiliar recreada en cada run)
          git push origin sync/backend --force

          # Crear el PR solo si no hay uno abierto; si existe, el push ya lo actualizó
          if [ "$(gh pr list --head sync/backend --base main --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head sync/backend \
              --title "Sync: update backend" \
              --body "Actualización automática de \`backend/\` en \`main\`, generada desde la rama \`backend\`.

          ⚠️ **Importante:** hacer merge con **\"Create a merge commit\"** (NO squash ni rebase) para conservar los commits y contribuciones originales de cada desarrollador."
          else
            echo "Ya existe un PR abierto sync/backend -> main; rama actualizada."
          fi
