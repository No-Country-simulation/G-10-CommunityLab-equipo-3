spring:
  application:
    name: communityLab
  profiles:
    active: dev

  ai:
    openai:
      api-key: ${API_KEY_LLM_MISTRAL_DEV}
      chat:
        model: ${MODEL_MISTRAL}
      base-url: ${BASE_URL_MODEL_AI}

  output:
    ansi:
      enabled: always

  # Why virtual threads: LLM calls, SSE and HTTP spend their time waiting on I/O; with 2 cores a platform pool either
  # sits idle or queues. OCI SDK calls run on a private platform pool inside OciObjectStorageAdapter (pinning, spec 010).
  threads:
    virtual:
      enabled: true

  # Why here and not per profile: prod needs the same 2s ceiling instead of Lettuce's 60s default (spec 010 RF-01)
  data:
    redis:
      connect-timeout: ${REDIS_TIMEOUT:2000ms}
      timeout: ${REDIS_TIMEOUT:2000ms}

# Value of buffer max batch size
redis:
  buffer:
    max:
      bytes: ${REDIS_BUFFER_MAX_BYTES:921600}

# Configuration Telegram
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    listen-group-id: ${TELEGRAM_LISTEN_GROUP_ID}

# config discord
discord:
  token: ${DISCORD_BOT_TOKEN}
  channel-id: ${DISCORD_LISTEN_CHANNEL_ID}

# Configuration Scheduler
buffer:
  flush:
    cron: ${BUFFER_FLUSH_CRON:0 0 * * * *}
    min-messages: ${BUFFER_FLUSH_MIN_MESSAGES:2}
    scheduler:
      enabled: ${BUFFER_FLUSH_SCHEDULER_ENABLED:true}

# Configuration OCI
oci:
  bucket: ${OCI_BUCKET}
  region: ${OCI_REGION}
  namespace: ${OCI_NAMESPACE}
  prefix: ${OCI_PREFIX}
  par-ttl-days: ${PAR_TTL_DAYS:7}
  # Object Storage client limits (spec 010 RF-06): worst case per call ~ max-attempts x (connect + read) + 2s backoff
  connect-timeout: ${OCI_CONNECT_TIMEOUT:5s}
  read-timeout: ${OCI_READ_TIMEOUT:20s}
  max-attempts: ${OCI_MAX_ATTEMPTS:2}
  auth-mode: ${OCI_AUTH_MODE:none}
  config-profile: ${OCI_CONFIG_PROFILE}
  compartment-id: ${OCI_COMPARTMENT_ID}

storage:
  stats:
    limit-bytes: ${STORAGE_LIMIT_BYTES:10737418240}
    monthly-requests-limit: ${STORAGE_REQUESTS_MONTHLY_LIMIT:50000}
    cache-ttl: ${STORAGE_STATS_CACHE_TTL:60s}
  # How long a package OCI already confirmed stays cached in Redis for revisions (spec 010 RF-08)
  package-cache-ttl: ${PACKAGE_CACHE_TTL:24h}

# Calls to the LLM in flight at once (spec 010 RF-07)
llm:
  max-concurrency: ${LLM_MAX_CONCURRENCY:3}
