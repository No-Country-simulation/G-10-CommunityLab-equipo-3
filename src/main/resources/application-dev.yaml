spring:
  # Config Redis
  cache:
    redis:
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_TIMEOUT:2000ms}
      timeout: ${REDIS_TIMEOUT:2000ms}

  # Specific to route of docker compose for start Redis instance
  docker:
    compose:
      file: docker-compose-dev.yaml

# Actuator Fase 1: health + info publicos (ver 004 RF-03), resto de actuadores cerrados
management:
  endpoints:
    web:
      exposure:
        include: health,info

# config discord
discord:
  token: ${DISCORD_BOT_TOKEN:}
  channel-id: ${DISCORD_LISTEN_CHANNEL_ID:}

# Config logging debug
logging:
  level:
    com.nocountry.simulation.communitylab.infrastructure.adapters.in: DEBUG
    com.nocountry.simulation.communitylab.infrastructure.adapters.out: DEBUG

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS_DEV}