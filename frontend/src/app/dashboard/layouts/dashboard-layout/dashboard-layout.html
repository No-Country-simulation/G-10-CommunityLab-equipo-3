<div class="min-h-screen">
  <p-toast position="bottom-right" />
  <app-sidebar
    [open]="sidebarOpen()"
    [collapsed]="sidebarCollapsed()"
    (close)="sidebarOpen.set(false)"
    (toggleCollapse)="toggleCollapsed()"
  />

  <div class="flex min-h-screen flex-col transition-[padding] duration-300 ease-out" [class]="sidebarCollapsed() ? 'lg:pl-[112px]' : 'lg:pl-[304px]'">
    <app-topbar (toggleSidebar)="sidebarOpen.set(!sidebarOpen())" />

    <main class="page-transition mx-auto w-full max-w-[1400px] flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>
