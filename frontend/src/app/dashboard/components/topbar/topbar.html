<header class="sticky top-0 z-20 mx-3 mt-3 flex h-[74px] items-center gap-3 rounded-clay border border-clay-subtle bg-white/90 px-4 shadow-[0_10px_24px_-6px_rgb(28_25_23/0.05),0_2px_6px_rgb(28_25_23/0.02)] backdrop-blur-xl dark:border-stone-800 dark:bg-espresso-card/90 sm:px-7 lg:top-4 lg:ml-0 lg:mr-4 lg:mt-4">
  <button type="button" class="nav-tile flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 lg:hidden"
    (click)="toggleSidebar.emit()" [attr.aria-label]="'topbar.openMenu' | t">
    <i class="pi pi-bars"></i>
  </button>

  <!-- Current page: same 3D icon as the sidebar; re-created on each navigation so it pops in -->
  @for (p of [page()]; track p.titleKey) {
    <div class="flex min-w-0 items-center gap-3">
      <img [src]="p.icon" alt="" width="40" height="40" decoding="async"
        class="topbar-page-icon h-10 w-10 shrink-0 object-contain" />
      <div class="topbar-page-title min-w-0 leading-tight">
        <p class="hidden text-[11px] font-medium uppercase tracking-wider text-slate-400 dark:text-slate-500 sm:block">Kora</p>
        <p class="truncate font-display text-base font-semibold text-slate-900 dark:text-slate-100">{{ p.titleKey | t }}</p>
      </div>
    </div>
  }

  <div class="ml-auto flex items-center gap-2">
    <!-- Language: ES · EN · PT segmented switch -->
    <div class="lang-switch" role="radiogroup" [attr.aria-label]="'topbar.language' | t">
      <i class="pi pi-globe lang-switch-globe" aria-hidden="true"></i>
      @for (l of langs; track l.code) {
        <button type="button" role="radio" class="lang-switch-option" [class.is-active]="i18n.lang() === l.code"
          [attr.aria-checked]="i18n.lang() === l.code" [attr.lang]="l.code"
          [pTooltip]="l.label" tooltipPosition="bottom" (click)="setLang(l.code)">{{ l.short }}</button>
      }
    </div>

    <button type="button" class="nav-tile flex h-10 w-10 items-center justify-center rounded-xl text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:bg-slate-800"
      (click)="theme.toggle()" [pTooltip]="(theme.isDark() ? 'topbar.lightMode' : 'topbar.darkMode') | t" tooltipPosition="bottom"
      [attr.aria-label]="(theme.isDark() ? 'topbar.toLight' : 'topbar.toDark') | t">
      <i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>

    <div class="mx-2 hidden h-6 w-px bg-slate-200 dark:bg-slate-700 sm:block"></div>

    <button type="button" class="nav-tile flex h-10 items-center gap-2 rounded-xl py-1 pl-1 pr-2.5 dark:hover:bg-slate-800"
      (click)="userMenuRef.toggle($event)" [attr.aria-label]="'topbar.userMenu' | t">
      <span class="rounded-full bg-gradient-to-br from-blue-500 via-cyan-500 to-sky-500 p-[2px]">
        <p-avatar label="CM" shape="circle" styleClass="!h-7 !w-7 !bg-white !text-[11px] !font-bold !text-blue-700 dark:!bg-slate-900 dark:!text-blue-300" />
      </span>
      <span class="hidden text-sm font-medium text-slate-800 dark:text-slate-100 md:block">Community Manager</span>
      <i class="pi pi-chevron-down hidden text-[10px] text-slate-400 md:block"></i>
    </button>
    <p-menu #userMenuRef [model]="userMenu()" [popup]="true" appendTo="body" />
  </div>
</header>
