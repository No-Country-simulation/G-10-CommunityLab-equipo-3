name: sync frontend to main

on:
  push:
    branches: [frontend]

concurrency:
  group: sync-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar identidad del Desarrollador
        # Los valores se pasan por env (no interpolados en el script)
        # para evitar inyección de comandos vía nombre/email del autor.
        env:
          COMMIT_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_EMAIL: ${{ github.event.head_commit.author.email }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          DEV_NAME="$COMMIT_NAME"
          DEV_EMAIL="$COMMIT_EMAIL"

          # Respaldo si el evento no trae metadatos directos del commit
          if [ -z "$DEV_EMAIL" ] || [ "$DEV_EMAIL" == "null" ]; then
            DEV_NAME="$ACTOR"
            DEV_EMAIL="${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          fi

          echo "Asignando commits a: $DEV_NAME <$DEV_EMAIL>"

          # Configuración estándar de Git
          git config user.name "$DEV_NAME"
          git config user.email "$DEV_EMAIL"

          # Forzar que el commit de merge del subtree use la identidad
          # del dev y NO la del bot
          {
            echo "GIT_AUTHOR_NAME=$DEV_NAME"
            echo "GIT_AUTHOR_EMAIL=$DEV_EMAIL"
            echo "GIT_COMMITTER_NAME=$DEV_NAME"
            echo "GIT_COMMITTER_EMAIL=$DEV_EMAIL"
          } >> "$GITHUB_ENV"

      - name: Sincronizar frontend y gestionar PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin

          # Verificar existencia de la rama remota
          if ! git ls-remote --exit-code --heads origin frontend > /dev/null; then
            echo "La rama origin/frontend aún no existe en el remoto. Omitiendo sincronización."
            exit 0
          fi

          # Rama puente siempre parte del estado actual de main
          git checkout -B sync/frontend main

          # NOTA: NO usar --squash. Así se conservan intactos todos los
          # commits individuales (autoría, fechas y líneas) de cada dev.
          SYNC_MSG="sync: Update frontend from branch frontend"
          if [ -d "frontend" ]; then
            if ! git subtree pull --prefix=frontend origin frontend \
              -m "$SYNC_MSG"; then
              echo "Pull normal falló (historias no relacionadas?). Reintentando con merge que permite historias no relacionadas..."
              git merge --abort 2>/dev/null || true
              git fetch origin frontend
              git merge --allow-unrelated-histories --no-ff -Xsubtree=frontend \
                -m "$SYNC_MSG" FETCH_HEAD
            fi
          else
            git subtree add --prefix=frontend origin frontend \
              -m "sync: Add frontend subtree from branch frontend"
          fi

          # Si no hay diferencias respecto a main, no hay nada que sincronizar
          if [ -z "$(git rev-list main..sync/frontend)" ]; then
            echo "sync/frontend no tiene cambios respecto a main. Nada que hacer."
            exit 0
          fi

          # Subir la rama puente (force: es una rama auxiliar recreada en cada run)
          git push origin sync/frontend --force

          # Crear el PR solo si no hay uno abierto; si existe, el push ya lo actualizó
          if [ "$(gh pr list --head sync/frontend --base main --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head sync/frontend \
              --title "Sync: update frontend" \
              --body "Actualización automática de \`frontend/\` en \`main\`, generada desde la rama \`frontend\`.

          ⚠️ **Importante:** hacer merge con **\"Create a merge commit\"** (NO squash ni rebase) para conservar los commits y contribuciones originales de cada desarrollador."
          else
            echo "Ya existe un PR abierto sync/frontend -> main; rama actualizada."
          fi
